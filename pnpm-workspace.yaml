packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true

onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - 'bcrypt'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'prisma'
  - 'protobufjs'
